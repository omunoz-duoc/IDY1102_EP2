# Perfil sin contraseñas: identidad de Windows del proceso que ejecuta el notebook.
dataretail360:
  target: local
  outputs:
    local:
      type: sqlserver
      driver: ODBC Driver 18 for SQL Server
      server: "{{ env_var('MSSQL_SERVER', 'localhost') }}"
      # Sin puerto forzado: misma resolución de instancia local que SQLAlchemy.
      port: null
      database: "{{ env_var('MSSQL_DATABASE', 'DataRetail360_DW') }}"
      schema: "{{ env_var('DBT_CANDIDATE_SCHEMA', 'dbt_dev') }}"
      windows_login: true
      encrypt: true
      trust_cert: true
      # Modelos y pruebas independientes en paralelo; el gate exige igualmente 58/58.
      threads: 4
      retries: 0
      login_timeout: 15
      query_timeout: 1800
