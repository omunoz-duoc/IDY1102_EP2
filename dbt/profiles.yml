dataretail360:
  target: local
  outputs:
    local:
      type: sqlserver
      driver: "{{ env_var('MSSQL_DRIVER', 'ODBC Driver 18 for SQL Server') }}"
      server: "{{ env_var('MSSQL_SERVER', 'localhost') }}"
      port: "{{ env_var('MSSQL_PORT', '1433') | int }}"
      database: "{{ env_var('MSSQL_DATABASE', 'DataRetail360_DW') }}"
      schema: "{{ env_var('DBT_CANDIDATE_SCHEMA', 'dbt_dev') }}"
      windows_login: "{{ (env_var('MSSQL_AUTH', 'sql') == 'windows') | as_bool }}"
      user: "{{ env_var('MSSQL_USER', '') }}"
      password: "{{ env_var('MSSQL_PASSWORD', '') }}"
      encrypt: true
      trust_cert: "{{ (env_var('MSSQL_TRUST_CERT', 'yes') == 'yes') | as_bool }}"
      threads: 4
      retries: 0
      login_timeout: 15
      query_timeout: 1800
