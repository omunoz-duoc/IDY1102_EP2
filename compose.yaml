name: dataretail360

# Configuración compartida por las tareas del pipeline. Contraseñas demo públicas: solo uso local.
x-runtime: &runtime
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: dataretail_demo
  PGUSER: demo
  PGPASSWORD: ${DEMO_PG_PASSWORD:-DemoPostgres_360!}
  MSSQL_SERVER: sqlserver
  MSSQL_PORT: "1433"
  MSSQL_DATABASE: DataRetail360_Demo
  MSSQL_AUTH: sql
  MSSQL_USER: sa
  MSSQL_PASSWORD: ${DEMO_SQL_PASSWORD:-DemoSqlServer_360!}
  MSSQL_TRUST_CERT: "yes"

x-task: &task
  build: .
  image: dataretail360-pipeline:latest
  platform: linux/amd64
  environment: *runtime
  volumes:
    # Por defecto un volumen Docker; DATARETAIL_WORKSPACE=./workspace lo publica en el host.
    - ${DATARETAIL_WORKSPACE:-workspace}:/workspace

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dataretail_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_PG_PASSWORD:-DemoPostgres_360!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d dataretail_demo"]
      interval: 5s
      timeout: 5s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DEMO_SQL_PASSWORD:-DemoSqlServer_360!}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  # Arranque de fuentes: dataset sintético idempotente. Si el origen ya tiene datos (p. ej. cargados
  # con `seed load`), los conserva sin cambios. DATARETAIL_SEED=none solo asegura la base destino.
  seed:
    <<: *task
    command: ["seed", "${DATARETAIL_SEED:-demo}"]
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  # Pipeline completo: extracción → Bronze/Silver → DWH → 4 marts (dbt) → Gold → controles y reporte.
  pipeline:
    <<: *task
    command: ["run"]
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

volumes:
  postgres-data:
  sqlserver-data:
  workspace:
